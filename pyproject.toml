[project]
name = "privmark"
version = "0.1.0"
description = "Evidence-linked local LLM privacy disclosure research prototype"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "streamlit>=1.45,<2",
  "scikit-learn>=1.5,<2",
  "torch>=2.6,<3",
  "transformers>=4.51,<5",
  "huggingface-hub>=0.30,<1",
  "safetensors>=0.5",
  "tqdm>=4.66",
  "ipykernel>=6",
  "ipywidgets>=8",
  "ruff>=0.11",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
norecursedirs = [".venv", "results", ".git"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]